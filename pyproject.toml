[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sokoradar"
version = "1.0.0"
description = "Early-warning forecasts of staple food price shocks in Kenyan markets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
sokoradar = "sokoradar.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
