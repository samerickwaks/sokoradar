<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#868e96"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#ced4da;stroke-width:1.2;rx:8}
      .group{fill:#f4f1ec;stroke:none;rx:12}
      .hl{fill:#fff4e6;stroke:#e8590c;stroke-width:1.6;rx:8}
      .t{font-size:13px;font-weight:600;fill:#212529;text-anchor:middle}
      .s{font-size:11px;fill:#495057;text-anchor:middle}
      .g{font-size:12px;font-weight:700;fill:#495057}
      .line{stroke:#868e96;stroke-width:1.4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="700" fill="#212529">SokoRadar: open data in, early warnings out on any phone</text>
  <text x="24" y="48" font-size="12" fill="#868e96">One monthly pipeline (GitHub Actions) feeds a precomputed forecast store; every channel answers from it.</text>

  <!-- sources -->
  <rect class="group" x="20" y="64" width="920" height="118"/>
  <text class="g" x="34" y="84">Open data sources</text>
  <rect class="box" x="34" y="94" width="138" height="74"/><text class="t" x="103" y="122">WFP prices</text><text class="s" x="103" y="140">HDX · monthly since 2006</text><text class="s" x="103" y="155">target</text>
  <rect class="box" x="184" y="94" width="138" height="74"/><text class="t" x="253" y="122">CHIRPS rainfall</text><text class="s" x="253" y="140">HDX · every 10 days</text><text class="s" x="253" y="155">47 counties</text>
  <rect class="box" x="334" y="94" width="138" height="74"/><text class="t" x="403" y="122">MODIS NDVI</text><text class="s" x="403" y="140">HDX · every 10 days</text><text class="s" x="403" y="155">crop &amp; pasture</text>
  <rect class="box" x="484" y="94" width="138" height="74"/><text class="t" x="553" y="122">CBK exchange rates</text><text class="s" x="553" y="140">KES/USD, UGX, TZS</text><text class="s" x="553" y="155">+ WFP-implied</text>
  <rect class="box" x="634" y="94" width="138" height="74"/><text class="t" x="703" y="122">World Bank</text><text class="s" x="703" y="140">Pink Sheet · RTFP</text><text class="s" x="703" y="155">global prices · goats</text>
  <rect class="box" x="784" y="94" width="142" height="74"/><text class="t" x="855" y="122">OCHA boundaries</text><text class="s" x="855" y="140">county map</text><text class="s" x="855" y="155">market → county</text>

  <!-- pipeline -->
  <path class="line" d="M480,182 L480,204"/>
  <rect class="box" x="120" y="206" width="720" height="50"/>
  <text class="t" x="480" y="227">Monthly pipeline · python -m sokoradar.pipeline run</text>
  <text class="s" x="480" y="245">ingest → clean to KES/kg → link markets to counties → ALPS (no look-ahead) → features</text>

  <!-- models -->
  <path class="line" d="M480,256 L480,276"/>
  <rect class="group" x="20" y="278" width="920" height="98"/>
  <text class="g" x="34" y="298">Models, backtested and retrained every month</text>
  <rect class="box" x="34" y="306" width="290" height="58"/><text class="t" x="179" y="330">Price forecasts, 1–3 months</text><text class="s" x="179" y="348">LightGBM · XGBoost · SARIMAX · Prophet → ensemble</text>
  <rect class="box" x="336" y="306" width="290" height="58"/><text class="t" x="481" y="330">Uncertainty and alerts</text><text class="s" x="481" y="348">conformal 80% intervals · ALPS phase classifier</text>
  <rect class="box" x="638" y="306" width="288" height="58"/><text class="t" x="782" y="330">Explanations and replays</text><text class="s" x="782" y="348">SHAP → English &amp; Kiswahili · 2011/2017/2022</text>

  <!-- store and api -->
  <path class="line" d="M300,376 L300,400"/>
  <rect class="box" x="150" y="402" width="300" height="50"/><text class="t" x="300" y="423">Forecast store (data/store)</text><text class="s" x="300" y="441">forecasts · alerts · history · metrics · bulletin</text>
  <path class="line" d="M450,427 L508,427"/>
  <rect class="box" x="510" y="402" width="300" height="50"/><text class="t" x="660" y="423">FastAPI service</text><text class="s" x="660" y="441">/forecast · /alerts · /what-if · /ussd</text>

  <!-- channels -->
  <path class="line" d="M300,452 L170,478"/>
  <path class="line" d="M660,452 L480,478"/>
  <path class="line" d="M660,452 L790,478"/>
  <rect class="box" x="40" y="480" width="260" height="66"/><text class="t" x="170" y="505">Streamlit dashboard</text><text class="s" x="170" y="522">map · forecasts · what-if · replay</text><text class="s" x="170" y="537">county officers, NDMA, NGOs</text>
  <rect class="hl" x="350" y="480" width="260" height="66"/><text class="t" x="480" y="505">USSD and SMS</text><text class="s" x="480" y="522">Africa's Talking · any phone · Kiswahili</text><text class="s" x="480" y="537">farmers, traders, pastoralists</text>
  <rect class="box" x="660" y="480" width="260" height="66"/><text class="t" x="790" y="505">Open API</text><text class="s" x="790" y="522">JSON forecasts and alerts</text><text class="s" x="790" y="537">WFP, Red Cross, researchers</text>
</svg>
